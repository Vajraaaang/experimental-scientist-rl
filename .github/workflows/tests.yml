name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the tested dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$GITHUB_WORKSPACE/requirements.lock"
          python -m pip install --no-build-isolation --no-deps -e "$GITHUB_WORKSPACE"
      - name: Verify the scientific and training contracts
        run: |
          python -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml"
          experimentlab validate-science --suite diagnostic --output "$RUNNER_TEMP/science-validation"
          experimentlab doctor --output "$RUNNER_TEMP/machine-inspection"
